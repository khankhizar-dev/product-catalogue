services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      - mailpit

  # Local mail catcher: view "sent" enquiry emails at http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
